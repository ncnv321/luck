<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/home.css" />
    <title>Home | luck</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="/js/transitions.js"></script>
  </head>

  <body>
    <main class="page-wrap">
      <h1 class="page-title">lucksttt</h1>
      <nav class="home-square" aria-label="Site sections">
        <div class="tile tile-art">
          <a href="/art.html" class="pic pic-artgallery">
            <img src="/images/ArtGallery.webp" alt="Art gallery" />
            <span class="tile-label">View my Art!</span>
          </a>
        </div>
        <div class="tile tile-sleepy">
          <img
            class="tile-bg bg-aboutme-grass"
            src="/images/AboutMeGrass.webp"
            alt=""
          />
          <a href="/aboutme.html" class="pic pic-aboutme">
            <img src="/images/aboutme.webp" alt="About me" />
            <span class="tile-label">About me</span>
          </a>
        </div>
        <div class="tile tile-bus">
          <img
            class="tile-bg bg-busstop-grass"
            src="/images/BusStopGrass.webp"
            alt=""
          />
          <a href="/music.html" class="pic pic-music">
            <img src="/images/Music.webp" alt="Music" />
            <span class="tile-label">Music</span>
          </a>
          <a href="/guestbook.html" class="pic pic-guestbook">
            <img src="/images/GuestBook.webp" alt="Guestbook" />
            <span class="tile-label">Guestbook</span>
          </a>
          <a href="/journal.html" class="pic pic-journal">
            <img src="/images/Journal.webp" alt="Journal" />
            <span class="tile-label">Journal</span>
          </a>
        </div>
      </nav>
      <div class="social-bar">
        <a
          href="https://twitter.com/lucksttt"
          class="social-link"
          target="_blank"
          rel="noopener"
        >
          <span class="icon-slot">
            <span class="placeholder">tw</span>
            <img
              src="/images/twitter.png"
              alt=""
              onload="this.parentElement.classList.add('loaded')"
              onerror="this.remove()"
            />
          </span>
          twitter
        </a>
        <a
          href="https://instagram.com/lucksttt"
          class="social-link"
          target="_blank"
          rel="noopener"
        >
          <span class="icon-slot">
            <span class="placeholder">ig</span>
            <img
              src="/images/instagram.png"
              alt=""
              onload="this.parentElement.classList.add('loaded')"
              onerror="this.remove()"
            />
          </span>
          instagram
        </a>
      </div>
    </main>

    <footer class="page-footer">luck est. 2023</footer>
  </body>
</html>
